[package]
name = "euv-example"
version = "0.6.35"
readme = "README.md"
edition = "2024"
authors = ["root@ltpp.vip"]
license = "MIT"
description = """An example application demonstrating the euv UI framework with reactive signals, custom components, and WebAssembly."""
keywords = ["cross-platform"]
repository = "https://github.com/euv-dev/euv.git"
categories = ["network-programming", "web-programming"]
publish = false
exclude = [
  "target",
  "Cargo.lock",
  "sh",
  ".github",
  "logs",
  "img",
  "**/*.log",
  "www",
]

[dependencies]
euv = { workspace = true }
serde = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
lombok-macros = { workspace = true }
compare_version = { workspace = true }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }
qrcode = { workspace = true, features = ["svg"] }

[build-dependencies]
toml = { workspace = true }
chrono = { workspace = true }

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib"]
