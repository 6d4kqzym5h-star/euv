name: Rust
on:
  push:
    branches:
      - '**'
env:
  CARGO_TERM_COLOR: always
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      packages_json: ${{ steps.read.outputs.packages_json }}
      branch_name: ${{ steps.read.outputs.branch_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install toml-cli
        run: cargo install toml-cli
      - name: Cache toml-cli
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/toml
          key: toml-cli-${{ runner.os }}
      - name: Read cargo metadata
        id: read
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "🌿 Branch: $BRANCH_NAME"
          PACKAGES_JSON="["
          FIRST=true
          EXCLUDE_DIRS=("example")
          for DIR in */; do
            DIR="${DIR%/}"
            if [[ ! -f "$DIR/Cargo.toml" ]]; then
              continue
            fi
            SKIP=false
            for EXCLUDE in "${EXCLUDE_DIRS[@]}"; do
              if [ "$DIR" = "$EXCLUDE" ]; then
                SKIP=true
                break
              fi
            done
            if [ "$SKIP" = "true" ]; then
              echo "⏭️ Skipping excluded package: $DIR"
              continue
            fi
            VERSION=$(toml get "$DIR/Cargo.toml" package.version --raw 2>/dev/null || echo "")
            PACKAGE_NAME=$(toml get "$DIR/Cargo.toml" package.name --raw 2>/dev/null || echo "")
            if [ -z "$VERSION" ] || [ -z "$PACKAGE_NAME" ]; then
              echo "⏭️ Skipping $DIR (no package info)"
              continue
            fi
            if [ "$BRANCH_NAME" = "master" ]; then
              TAG="${PACKAGE_NAME}-v${VERSION}"
            else
              TAG="${PACKAGE_NAME}-v${VERSION}-${BRANCH_NAME}"
            fi
            echo "📦 Detected package: $PACKAGE_NAME v$VERSION in $DIR (tag: $TAG)"
            if [ "$FIRST" = "true" ]; then
              FIRST=false
            else
              PACKAGES_JSON+=","
            fi
            PACKAGES_JSON+="{\"dir\":\"$DIR\",\"name\":\"$PACKAGE_NAME\",\"version\":\"$VERSION\",\"tag\":\"$TAG\"}"
          done
          PACKAGES_JSON+="]"
          echo "📋 Packages JSON: $PACKAGES_JSON"
          echo "packages_json=$PACKAGES_JSON" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

  check:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt -- --check

  tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run tests
        run: cargo test --all-features -- --nocapture

  clippy:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Load clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy --all-features

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup build
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build release
        run: cargo check --release --all-features

  publish:
    permissions:
      contents: write
    needs: [setup, check, tests, clippy, build]
    if: needs.setup.outputs.branch_name == 'master'
    runs-on: ubuntu-latest
    outputs:
      published_packages: ${{ steps.publish.outputs.published_packages }}
    steps:
      - name: Check branch
        id: check_branch
        run: |
          if [ "${{ needs.setup.outputs.branch_name }}" != "master" ]; then
            echo "⚠️ Not on master branch (current: ${{ needs.setup.outputs.branch_name }}), skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ On master branch, proceeding with publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        if: steps.check_branch.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: Restore toml-cli
        if: steps.check_branch.outputs.skip == 'false'
        uses: actions/cache@v3
        with:
          path: ~/.cargo/bin/toml
          key: toml-cli-${{ runner.os }}
      - name: Configure git
        if: steps.check_branch.outputs.skip == 'false'
        run: |
          git config user.name "eastspire"
          git config user.email "root@ltpp.vip"
      - name: Publish to crates.io
        id: publish
        if: steps.check_branch.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "published_packages=[]" >> $GITHUB_OUTPUT
          echo "${{ secrets.CARGO_REGISTRY_TOKEN }}" | cargo login
          PACKAGES='${{ needs.setup.outputs.packages_json }}'
          PUBLISHED="["
          FIRST=true
          for row in $(echo "$PACKAGES" | jq -c '.[]'); do
            DIR=$(echo "$row" | jq -r '.dir')
            PACKAGE_NAME=$(echo "$row" | jq -r '.name')
            VERSION=$(echo "$row" | jq -r '.version')
            MAX_RETRY=36
            SUCCESS=false
            echo "🚀 Publishing $PACKAGE_NAME v$VERSION from $DIR"
            for ((i=1; i<=MAX_RETRY; i++)); do
              echo "🚀 Attempt $i/$MAX_RETRY: publishing $PACKAGE_NAME v$VERSION"
              if cargo publish -p "$PACKAGE_NAME" --allow-dirty; then
                echo "✅ $PACKAGE_NAME v$VERSION published successfully"
                echo "📦 Crates.io: https://crates.io/crates/$PACKAGE_NAME/$VERSION"
                echo "📚 Docs.rs: https://docs.rs/$PACKAGE_NAME/$VERSION"
                SUCCESS=true
                if [ "$FIRST" = "true" ]; then
                  FIRST=false
                else
                  PUBLISHED+=","
                fi
                PUBLISHED+="{\"dir\":\"$DIR\",\"name\":\"$PACKAGE_NAME\",\"version\":\"$VERSION\"}"
                break
              else
                echo "⚠️ Attempt $i failed for $PACKAGE_NAME"
                if [ "$i" -lt "$MAX_RETRY" ]; then
                  echo "🔁 Retrying in 5 seconds..."
                  sleep 5
                fi
              fi
            done
            if [ "$SUCCESS" != "true" ]; then
              echo "❌ $PACKAGE_NAME publish failed after $MAX_RETRY attempts"
            fi
          done
          PUBLISHED+="]"
          echo "published_packages=$PUBLISHED" >> $GITHUB_OUTPUT
          echo "🎉🎉🎉 PUBLISH COMPLETED 🎉🎉🎉"
      - name: Sync workspace dependency versions
        if: steps.check_branch.outputs.skip == 'false'
        run: |
          PACKAGES='${{ needs.setup.outputs.packages_json }}'
          CHANGED=false
          for row in $(echo "$PACKAGES" | jq -c '.[]'); do
            DIR=$(echo "$row" | jq -r '.dir')
            PACKAGE_NAME=$(echo "$row" | jq -r '.name')
            VERSION=$(echo "$row" | jq -r '.version')
            CURRENT_VERSION=$(toml get Cargo.toml "workspace.dependencies.$PACKAGE_NAME.version" --raw 2>/dev/null || echo "")
            if [ -z "$CURRENT_VERSION" ]; then
              echo "⏭️ $PACKAGE_NAME not found in workspace.dependencies"
              continue
            fi
            if [ "$CURRENT_VERSION" != "$VERSION" ]; then
              echo "🔄 Updating $PACKAGE_NAME: $CURRENT_VERSION -> $VERSION"
              sed -i "s|^$PACKAGE_NAME = { version = \"$CURRENT_VERSION\"|$PACKAGE_NAME = { version = \"$VERSION\"|" Cargo.toml
              CHANGED=true
            else
              echo "✅ $PACKAGE_NAME already up to date: $VERSION"
            fi
          done
          if [ "$CHANGED" = "true" ]; then
            git add Cargo.toml
            git commit -m "chore: sync workspace dependency versions"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Workspace dependencies synced and pushed"
          else
            echo "✅ All workspace dependencies are already in sync"
          fi

  release:
    needs: [setup, check, tests, clippy, build, publish]
    permissions:
      contents: write
      packages: write
    if: needs.setup.outputs.branch_name == 'master'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read published packages
        id: published_info
        run: |
          echo "published_packages=${{ needs.publish.outputs.published_packages }}" >> $GITHUB_OUTPUT
          echo "branch_name=${{ needs.setup.outputs.branch_name }}" >> $GITHUB_OUTPUT
      - name: Create or update releases
        id: release
        run: |
          echo "released=false" >> $GITHUB_OUTPUT
          BRANCH_NAME="${{ steps.published_info.outputs.branch_name }}"
          PACKAGES='${{ needs.setup.outputs.packages_json }}'
          ANY_SUCCESS=false
          for row in $(echo "$PACKAGES" | jq -c '.[]'); do
            DIR=$(echo "$row" | jq -r '.dir')
            PACKAGE_NAME=$(echo "$row" | jq -r '.name')
            VERSION=$(echo "$row" | jq -r '.version')
            TAG=$(echo "$row" | jq -r '.tag')
            echo "📦 Processing release for $PACKAGE_NAME v$VERSION (tag: $TAG)"
            echo "📦 Building source archives..."
            git archive --format=zip --prefix="${PACKAGE_NAME}-${VERSION}/" HEAD > "${PACKAGE_NAME}-${VERSION}.zip"
            git archive --format=tar.gz --prefix="${PACKAGE_NAME}-${VERSION}/" HEAD > "${PACKAGE_NAME}-${VERSION}.tar.gz"
            if gh release view "$TAG" > /dev/null 2>&1; then
              echo "🔄 Updating existing release: $TAG"
              gh release view "$TAG" --json assets --jq '.assets[].name' | while read asset; do
                if [ -n "$asset" ]; then
                  echo "🗑️ Deleting asset: $asset"
                  gh release delete-asset "$TAG" "$asset" --yes || true
                fi
              done
              TITLE="[$BRANCH_NAME] $TAG updated $(date '+%Y-%m-%d %H:%M:%S')"
              if gh release edit "$TAG" \
                  --title "$TITLE" \
                  --notes "[$BRANCH_NAME] - release $TAG updated at $(date '+%Y-%m-%d %H:%M:%S UTC')
              ## Changes
              - Branch: $BRANCH_NAME
              - Version: $VERSION
              - Package: $PACKAGE_NAME
              ## Links
              📦 [Crate on crates.io](https://crates.io/crates/$PACKAGE_NAME/$VERSION)
              📚 [Documentation on docs.rs](https://docs.rs/$PACKAGE_NAME/$VERSION)
              📋 [Commit History](https://github.com/${{ github.repository }}/commits/$TAG)" && \
                 gh release upload "$TAG" "${PACKAGE_NAME}-${VERSION}.zip" "${PACKAGE_NAME}-${VERSION}.tar.gz" --clobber; then
                echo "✅ Updated release $TAG"
                ANY_SUCCESS=true
              else
                echo "❌ Failed to update release $TAG"
              fi
            else
              if ! git tag -l | grep -q "^${TAG}$"; then
                echo "🏷️ Creating tag: $TAG"
                git tag "$TAG"
              fi
              if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
                echo "🌐 Pushing tag: $TAG"
                git push origin "$TAG"
              fi
              echo "🆕 Creating new release: $TAG"
              TITLE="[$BRANCH_NAME] $TAG created $(date '+%Y-%m-%d %H:%M:%S')"
              if gh release create "$TAG" \
                --title "$TITLE" \
                --notes "[$BRANCH_NAME] - release $TAG created at $(date '+%Y-%m-%d %H:%M:%S UTC')
              ## Changes
              - Branch: $BRANCH_NAME
              - Version: $VERSION
              - Package: $PACKAGE_NAME
              ## Links
              📦 [Crate on crates.io](https://crates.io/crates/$PACKAGE_NAME/$VERSION)
              📚 [Documentation on docs.rs](https://docs.rs/$PACKAGE_NAME/$VERSION)
              📋 [Commit History](https://github.com/${{ github.repository }}/commits/$TAG)" \
                --latest && \
                 gh release upload "$TAG" "${PACKAGE_NAME}-${VERSION}.zip" "${PACKAGE_NAME}-${VERSION}.tar.gz"; then
                echo "✅ Created release $TAG"
                ANY_SUCCESS=true
              else
                echo "❌ Failed to create release $TAG"
              fi
            fi
          done
          if [ "$ANY_SUCCESS" = "true" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "🚀 All releases processed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
