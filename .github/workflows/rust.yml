name: Rust
on:
  push:
    branches:
      - '**'
env:
  CARGO_TERM_COLOR: always
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      package_name: ${{ steps.read.outputs.package_name }}
      branch_name: ${{ steps.read.outputs.branch_name }}
      setup_sha: ${{ steps.push.outputs.setup_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Read cargo metadata
        id: read
        run: |
          VERSION=$(python3 -c "import tomllib; d=tomllib.load(open('Cargo.toml','rb')); print(d['package']['version'])")
          PACKAGE_NAME=$(python3 -c "import tomllib; d=tomllib.load(open('Cargo.toml','rb')); print(d['package']['name'])")
          BRANCH_NAME="${{ github.ref_name }}"
          echo "📦 Detected package: $PACKAGE_NAME v$VERSION"
          echo "🌿 Branch: $BRANCH_NAME"
          if [ -z "$VERSION" ] || [ -z "$PACKAGE_NAME" ]; then
            echo "❌ Failed to read package info from Cargo.toml"
            exit 1
          fi
          if [ "$BRANCH_NAME" = "master" ]; then
            TAG="v$VERSION"
          else
            TAG="v$VERSION-$BRANCH_NAME"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "package_name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
      - name: Sync workspace versions
        id: push
        run: |
          VERSION="${{ steps.read.outputs.version }}"
          echo "🔧 Syncing all versions to $VERSION"
          sed -i "s|^euv = { path = \"./\", version = \".*\" }|euv = { path = \"./\", version = \"$VERSION\" }|" Cargo.toml
          sed -i "s|^euv-cli = { path = \"cli\", version = \".*\" }|euv-cli = { path = \"cli\", version = \"$VERSION\" }|" Cargo.toml
          sed -i "s|^euv-core = { path = \"core\", version = \".*\" }|euv-core = { path = \"core\", version = \"$VERSION\" }|" Cargo.toml
          sed -i "s|^euv-macros = { path = \"macros\", version = \".*\" }|euv-macros = { path = \"macros\", version = \"$VERSION\" }|" Cargo.toml
          sed -i "s|^euv-example = { path = \"example\", version = \".*\" }|euv-example = { path = \"example\", version = \"$VERSION\" }|" Cargo.toml
          sed -i "s|^version = \".*\"|version = \"$VERSION\"|" core/Cargo.toml
          sed -i "s|^version = \".*\"|version = \"$VERSION\"|" macros/Cargo.toml
          sed -i "s|^version = \".*\"|version = \"$VERSION\"|" cli/Cargo.toml
          sed -i "s|^version = \".*\"|version = \"$VERSION\"|" example/Cargo.toml
          echo "🔧 Synced all workspace.dependencies versions to $VERSION"
          echo "🔧 Synced all sub-crate package.version to $VERSION"
          git config user.name "eastspire"
          git config user.email "root@ltpp.vip"
          git add .
          if git diff --cached --quiet; then
            SETUP_SHA="${{ github.sha }}"
            echo "✅ No version changes needed, already synced"
          else
            git commit -m "chore: sync all versions to $VERSION"
            git push
            SETUP_SHA=$(git rev-parse HEAD)
            echo "✅ Pushed version sync commit: $SETUP_SHA"
          fi
          echo "setup_sha=$SETUP_SHA" >> $GITHUB_OUTPUT

  check:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.setup_sha }}
      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format check
        run: cargo fmt -- --check

  tests:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.setup_sha }}
      - name: Prepare environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run tests
        run: cargo test --all-features -- --nocapture

  clippy:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.setup_sha }}
      - name: Load clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy
      - name: Run clippy
        run: cargo clippy --all-features

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.setup_sha }}
      - name: Setup build
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build release
        run: cargo check --release --all-features

  publish:
    permissions:
      contents: write
    needs: [setup, check, tests, clippy, build]
    if: needs.setup.outputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Check branch
        id: check_branch
        run: |
          if [ "${{ needs.setup.outputs.branch_name }}" != "master" ]; then
            echo "⚠️ Not on master branch (current: ${{ needs.setup.outputs.branch_name }}), skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "✅ On master branch, proceeding with publish"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Checkout
        if: steps.check_branch.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.setup.outputs.setup_sha }}
      - name: Configure git
        if: steps.check_branch.outputs.skip == 'false'
        run: |
          git config user.name "eastspire"
          git config user.email "root@ltpp.vip"
      - name: Publish to crates.io
        id: publish
        if: steps.check_branch.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          echo "published=false" >> $GITHUB_OUTPUT
          VERSION="${{ needs.setup.outputs.version }}"
          echo "${{ secrets.CARGO_REGISTRY_TOKEN }}" | cargo login
          echo "📦 Publishing workspace crates in dependency order..."
          PUBLISH_ORDER="core macros cli"
          SUCCESS=true
          for crate in $PUBLISH_ORDER; do
            CRATE_DIR="$crate"
            CRATE_NAME=$(python3 -c "import tomllib; d=tomllib.load(open('$CRATE_DIR/Cargo.toml','rb')); print(d['package']['name'])")
            echo "🚀 Publishing $CRATE_NAME v$VERSION..."
            MAX_RETRY=10
            PUBLISHED=false
            for ((i=1; i<=MAX_RETRY; i++)); do
              if (cd "$CRATE_DIR" && cargo publish --no-verify 2>&1); then
                echo "✅ Published $CRATE_NAME v$VERSION"
                PUBLISHED=true
                break
              else
                echo "⚠️ Attempt $i/$MAX_RETRY failed for $CRATE_NAME"
                if [ "$i" -lt "$MAX_RETRY" ]; then
                  echo "🔁 Retrying in 10s..."
                  sleep 10
                fi
              fi
            done
            if [ "$PUBLISHED" != "true" ]; then
              echo "❌ Failed to publish $CRATE_NAME after $MAX_RETRY attempts"
              SUCCESS=false
              break
            fi
            echo "⏳ Waiting 15s for $CRATE_NAME to propagate on crates.io..."
            sleep 15
          done
          if [ "$SUCCESS" = "true" ]; then
            echo "📦 Publishing root crate euv v$VERSION..."
            MAX_RETRY=10
            for ((i=1; i<=MAX_RETRY; i++)); do
              if cargo publish --no-verify 2>&1; then
                echo "✅ Published euv v$VERSION"
                echo "published=true" >> $GITHUB_OUTPUT
                echo "🎉🎉🎉 PUBLISH SUCCESSFUL 🎉🎉🎉"
                echo "📦 Crates.io: https://crates.io/crates/euv/$VERSION"
                echo "📚 Docs.rs: https://docs.rs/euv/$VERSION"
                break
              else
                echo "⚠️ Attempt $i/$MAX_RETRY failed for euv"
                if [ "$i" -lt "$MAX_RETRY" ]; then
                  echo "🔁 Retrying in 10s..."
                  sleep 10
                fi
              fi
            done
          fi

  release:
    needs: [setup, check, tests, clippy, build, publish]
    permissions:
      contents: write
      packages: write
    if: needs.setup.outputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.setup.outputs.setup_sha }}
      - name: Get package name and branch info
        id: package_info
        run: |
          echo "package_name=${{ needs.setup.outputs.package_name }}" >> $GITHUB_OUTPUT
          echo "branch_name=${{ needs.setup.outputs.branch_name }}" >> $GITHUB_OUTPUT
      - name: Check tag status
        id: check_tag
        run: |
          if git tag -l | grep -q "^${{ needs.setup.outputs.tag }}$"; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
            echo "🏷️ Tag ${{ needs.setup.outputs.tag }} exists locally"
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
            echo "🏷️ Tag ${{ needs.setup.outputs.tag }} does not exist locally"
          fi
          if git ls-remote --tags origin | grep -q "refs/tags/${{ needs.setup.outputs.tag }}$"; then
            echo "remote_tag_exists=true" >> $GITHUB_OUTPUT
            echo "🌐 Tag ${{ needs.setup.outputs.tag }} exists on remote"
          else
            echo "remote_tag_exists=false" >> $GITHUB_OUTPUT
            echo "🌐 Tag ${{ needs.setup.outputs.tag }} does not exist on remote"
          fi
      - name: Check release status
        id: check_release
        run: |
          if gh release view "${{ needs.setup.outputs.tag }}" > /dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "📦 Release ${{ needs.setup.outputs.tag }} already exists"
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "📦 Release ${{ needs.setup.outputs.tag }} does not exist"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or update release
        id: release
        run: |
          set -e
          echo "released=false" >> $GITHUB_OUTPUT
          PACKAGE_NAME="${{ steps.package_info.outputs.package_name }}"
          VERSION="${{ needs.setup.outputs.version }}"
          TAG="${{ needs.setup.outputs.tag }}"
          echo "📦 Building source archives..."
          git archive --format=zip --prefix="${PACKAGE_NAME}-${VERSION}/" HEAD > "${PACKAGE_NAME}-${VERSION}.zip"
          git archive --format=tar.gz --prefix="${PACKAGE_NAME}-${VERSION}/" HEAD > "${PACKAGE_NAME}-${VERSION}.tar.gz"
          if [ "${{ steps.check_release.outputs.release_exists }}" = "true" ]; then
            echo "🔄 Updating existing release: $TAG"
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read asset; do
              if [ -n "$asset" ]; then
                echo "🗑️ Deleting asset: $asset"
                gh release delete-asset "$TAG" "$asset" --yes || true
              fi
            done
            BRANCH_NAME="${{ steps.package_info.outputs.branch_name }}"
          TITLE="[$BRANCH_NAME]($TAG updated $(date '+%Y-%m-%d %H:%M:%S'))"
          if gh release edit "$TAG" \
              --title "$TITLE" \
              --notes "[$BRANCH_NAME] - release $TAG updated at $(date '+%Y-%m-%d %H:%M:%S UTC')
            ## Changes
            - Branch: $BRANCH_NAME
            - Version: $VERSION
            - Package: $PACKAGE_NAME
            ## Links
            📦 [Crate on crates.io](https://crates.io/crates/$PACKAGE_NAME/$VERSION)
            📚 [Documentation on docs.rs](https://docs.rs/$PACKAGE_NAME/$VERSION)
            📋 [Commit History](https://github.com/${{ github.repository }}/commits/$TAG)" && \
               gh release upload "$TAG" "${PACKAGE_NAME}-${VERSION}.zip" "${PACKAGE_NAME}-${VERSION}.tar.gz" --clobber; then
              echo "released=true" >> $GITHUB_OUTPUT
              echo "✅ Updated release $TAG"
              echo "🔖 Tag: $TAG"
              echo "🚀 Release: [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)"
            else
              echo "❌ Failed to update release"
            fi
          else
            if [ "${{ steps.check_tag.outputs.remote_tag_exists }}" = "false" ]; then
              echo "🏷️ Creating and pushing tag: $TAG"
              git tag "$TAG"
              git push origin "$TAG"
            fi
            echo "🆕 Creating new release: $TAG"
            BRANCH_NAME="${{ steps.package_info.outputs.branch_name }}"
            TITLE="[$BRANCH_NAME]($TAG created $(date '+%Y-%m-%d %H:%M:%S'))"
            if gh release create "$TAG" \
              --title "$TITLE" \
              --notes "[$BRANCH_NAME] - release $TAG created at $(date '+%Y-%m-%d %H:%M:%S UTC')
            ## Changes
            - Branch: $BRANCH_NAME
            - Version: $VERSION
            - Package: $PACKAGE_NAME
            ## Links
            📦 [Crate on crates.io](https://crates.io/crates/$PACKAGE_NAME/$VERSION)
            📚 [Documentation on docs.rs](https://docs.rs/$PACKAGE_NAME/$VERSION)
            📋 [Commit History](https://github.com/${{ github.repository }}/commits/$TAG)" \
              --latest && \
               gh release upload "$TAG" "${PACKAGE_NAME}-${VERSION}.zip" "${PACKAGE_NAME}-${VERSION}.tar.gz"; then
              echo "released=true" >> $GITHUB_OUTPUT
              echo "✅ Created release $TAG"
              echo "🔖 Tag: $TAG"
              echo "🚀 Release: [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)"
            else
              echo "❌ Failed to create release"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
