name: Deploy Pages

on:
  workflow_run:
    workflows: [Rust]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pages-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build example
        run: cargo run -p euv-cli -- build --release --crate-path ./example -- --target web --out-dir www/pkg --out-name euv --no-typescript --no-pack --no-gitignore

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync Pages
        run: |
          max_retries=60
          retry_delay=60
          for i in $(seq 1 $max_retries); do
            if curl -sf -X POST https://ltpp.vip/api/github/pages/sync/euv-dev/euv \
              -H "Connection: close"; then
              echo ""
              echo "Sync succeeded on attempt $i"
              exit 0
            fi
            echo "Attempt $i of $max_retries failed"
            if [ $i -lt $max_retries ]; then
              echo "Retrying in ${retry_delay}s..."
              sleep $retry_delay
            fi
          done
          echo "All $max_retries attempts failed"
          exit 1
